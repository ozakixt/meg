<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>巡り帖 — 店舗とポケふた</title>
<meta name="theme-color" content="#f6f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巡り帖+">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:oklch(0.972 0.01 85);--paper2:oklch(0.94 0.016 85);--card:oklch(0.99 0.006 85);
  --ink:oklch(0.27 0.02 150);--ink2:oklch(0.47 0.02 150);--ink3:oklch(0.62 0.015 120);
  --line:oklch(0.87 0.016 85);--green:oklch(0.46 0.09 155);--green-soft:oklch(0.93 0.03 155);
  --shu:oklch(0.55 0.15 32);--shu-soft:oklch(0.94 0.03 32);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --safe-top:calc(env(safe-area-inset-top,0px) + 12px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:14px}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--green)}a:hover{color:var(--ink)}
#app{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--paper2)}
#map.simple{background:oklch(0.925 0.018 200)}
.leaflet-tile-pane{filter:saturate(.35) sepia(.18) contrast(.96) brightness(1.02)}
#map.transit .leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.08);opacity:.7}
.t-hint{position:absolute;left:50%;top:calc(var(--safe-top) + 178px);transform:translateX(-50%);z-index:480;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:11.5px;padding:6px 12px;border-radius:14px;box-shadow:0 2px 8px oklch(0.3 0.02 150/.12);transition:opacity .25s;pointer-events:none;white-space:nowrap;opacity:0}
.leaflet-tooltip.st-label{background:transparent;border:0;box-shadow:none;padding:0;font-weight:700;font-size:11px;color:#2b2f33;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.leaflet-tooltip.st-label::before{display:none}
.leaflet-rail-pane{pointer-events:none}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in oklch,var(--paper) 80%,transparent)!important}
[data-v="a"] .leaflet-bottom,[data-v="b"] .leaflet-bottom{bottom:var(--attr-b,0)}
[data-v="c"] .leaflet-bottom{bottom:178px}

/* top controls */
.top{position:absolute;left:0;right:0;top:0;z-index:500;padding:var(--safe-top) 14px 10px;display:flex;flex-direction:column;gap:10px}
[data-v="a"] .top,[data-v="b"] .top{background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.04em}
.brand h1 small{font-size:11px;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:0}
.loc{font-size:11px;color:var(--ink2);font-family:var(--mono);white-space:nowrap}
.ctrls{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.ctrls::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;position:relative;transition:background .15s,border-color .15s}
.chip select{appearance:none;border:0;background:transparent;font-weight:700;padding-right:14px;outline:none;cursor:pointer}
.chip .caret{position:absolute;right:11px;width:6px;height:6px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(45deg) translateY(-2px);pointer-events:none}
.chip.on{background:var(--green);border-color:var(--green);color:var(--card)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.chip.on .dot{background:var(--card)}
.chip .sdot{width:10px;height:10px;border-radius:50%;background:conic-gradient(#8CC63F 0 50%,var(--green) 0)}
.chip b{font-weight:500}
.chip.got{background:#8CC63F;border-color:#7AB32E;color:oklch(0.25 0.04 140)}.chip.got .sdot{background:#8CC63F;box-shadow:0 0 0 1.5px oklch(0.25 0.04 140)}
.chip.not{background:var(--ink);border-color:var(--ink);color:var(--card)}.chip.not .sdot{background:var(--green);box-shadow:0 0 0 1.5px var(--card)}
.legend{position:absolute;left:12px;right:64px;z-index:450;display:flex;flex-wrap:wrap;gap:4px 10px;width:max-content;max-width:calc(100% - 76px);padding:2px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px oklch(0.3 0.02 150/.12);font-size:11px;color:var(--ink2)}
.legend button{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);height:28px;padding:0 4px;border-radius:8px}.legend button:hover{background:var(--paper2)}.legend button.off{color:var(--ink3);text-decoration:line-through;opacity:.5}.legend button.off i{box-shadow:0 0 0 1.5px var(--line)!important;background:transparent!important}.legend i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px var(--line)}
[data-v="a"] .legend,[data-v="b"] .legend{top:calc(var(--safe-top) + 168px)}[data-v="c"] .legend{top:212px}
.seg{flex:none;display:flex;height:34px;padding:3px;border-radius:17px;background:var(--paper2);border:1px solid var(--line)}
.seg button{flex:1;padding:0 11px;border-radius:14px;font-size:12px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px oklch(0.3 0.02 150/.15)}
[data-v="c"] .brand{background:var(--card);border-radius:22px;padding:10px 14px;box-shadow:0 2px 10px oklch(0.3 0.02 150/.14);border:1px solid var(--line)}
[data-v="c"] .chip,[data-v="c"] .seg{box-shadow:0 2px 8px oklch(0.3 0.02 150/.12)}
.bookbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:15px;background:var(--shu-soft);color:var(--shu);font-weight:700;font-size:12px}
.bookbtn i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--shu);display:grid;place-items:center;font-style:normal;font-size:10px;font-family:var(--mono)}

.fab{position:absolute;right:12px;z-index:450;width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px oklch(0.3 0.02 150/.15);display:grid;place-items:center}
.fab span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);position:relative}
.fab span::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
[data-v="a"] .fab,[data-v="b"] .fab{top:calc(var(--safe-top) + 168px)}
.src{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:-2px}
.src span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src span::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.src.live span::before{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.src.busy span::before{background:oklch(0.7 0.13 75)}
.src button{flex:none;color:var(--green);font-weight:500;font-family:var(--mono);font-size:10.5px}
.src button:disabled{color:var(--ink3)}
[data-v="c"] .fab{top:212px}

/* sheet (a,b) */
.sheet{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:600;background:var(--paper);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 20px oklch(0.3 0.02 150/.12);display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.8,.2,1)}
.sheet[data-s="min"]{height:62px}.sheet[data-s="min"] .list{visibility:hidden}.sheet.drag{transition:none}.sheet[data-s="peek"]{height:132px}.sheet[data-s="half"]{height:44%}.sheet[data-s="full"]{height:calc(100% - var(--safe-top) - 206px)}
.handle{padding:9px 0 4px;display:grid;place-items:center;width:100%}
.handle::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line)}
.sh-head{display:flex;align-items:baseline;justify-content:space-between;padding:4px 18px 10px;border-bottom:1px dashed var(--line)}
.sh-head b{font-size:16px;font-weight:900}
.sh-head span{font-size:11px;color:var(--ink2);font-family:var(--mono)}
.list{overflow-y:auto;flex:1;padding:4px 0 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:hover{background:var(--paper2)}
.row .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.row .nm em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-family:var(--mono);font-size:13px;font-weight:500;text-align:right}
.row .st{font-size:12px;color:var(--ink2)}
.row .wk{font-size:11px;color:var(--ink3);text-align:right;font-family:var(--mono)}
.mini-stamp{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--shu);color:var(--shu);font-size:9px;display:grid;place-items:center;font-weight:900;transform:rotate(-10deg)}
.badge{display:inline-flex;align-items:center;gap:5px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.badge.soon::before{background:oklch(0.7 0.13 75)}
.badge.closed,.badge.unknown{color:var(--ink3)}.badge.unknown::before{background:var(--line)}.badge.unknown b{color:var(--ink3);font-weight:500}.badge.closed::before{background:var(--ink3)}
.badge b{color:var(--green);font-weight:700}.badge.soon b{color:oklch(0.55 0.13 65)}.badge.closed b{color:var(--ink2)}
.empty{padding:40px 24px;text-align:center;color:var(--ink2);font-size:13px}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));z-index:700;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink3)}
.tabs button i{width:22px;height:22px;border-radius:6px;border:1.8px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900}
.tabs button.t-book i{border-radius:50%}
.tabs button.on{color:var(--ink)}
.tabs button.on.t-book{color:var(--shu)}

/* cards (c) */
.cards{position:absolute;left:0;right:0;bottom:22px;z-index:600;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 24px 10px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.ticket{flex:none;width:300px;height:142px;scroll-snap-align:center;display:grid;grid-template-columns:1fr 86px;background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 14px oklch(0.3 0.02 150/.16);text-align:left;position:relative;transition:transform .2s,box-shadow .2s}
.ticket.cur{transform:translateY(-4px);box-shadow:0 8px 22px oklch(0.3 0.02 150/.22);border-color:var(--green)}
.ticket .main{padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ticket .pf{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
.ticket .nm{font-weight:900;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ticket .st{font-size:12px;color:var(--ink2);margin-top:auto}
.ticket .stub{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;background:var(--paper)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ticket .stub::before{top:-9px;background:oklch(0.95 0.01 85)}.ticket .stub::after{bottom:-9px;background:oklch(0.95 0.01 85)}
.ticket .km{font-family:var(--mono);font-weight:500;font-size:18px}
.ticket .wk{font-size:10px;color:var(--ink2)}
.ticket .ring{width:46px;height:46px;border-radius:50%;border:1.5px dashed var(--ink3);display:grid;place-items:center;font-size:10px;color:var(--ink3)}
.ticket .ring.done{border:2px solid var(--shu);color:var(--shu);font-weight:900;font-size:12px;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--shu)}

/* detail */
.detail{position:absolute;left:8px;right:8px;bottom:8px;z-index:900;background:var(--card);border-radius:24px;border:1px solid var(--line);box-shadow:0 10px 40px oklch(0.3 0.02 150/.28);padding:18px 18px 18px;transform:translateY(calc(100% + 24px));visibility:hidden;pointer-events:none;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s}
.detail.show{transform:none;visibility:visible;pointer-events:auto;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.dt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dt-pf{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
.dt-nm{margin:4px 0 0;font-size:21px;font-weight:900;line-height:1.25;text-wrap:pretty}
.x{flex:none;width:34px;height:34px;border-radius:17px;background:var(--paper2);position:relative}
.x::before,.x::after{content:"";position:absolute;left:10px;right:10px;top:16px;height:2px;background:var(--ink2);transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.dt-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0 16px;font-size:13px}
.dt-grid dt{color:var(--ink3);font-size:11px;padding-top:2px}
.dt-grid dd{margin:0}
.dt-grid .mono{font-family:var(--mono)}
.dt-act{display:flex;align-items:center;gap:14px;border-top:1px dashed var(--line);padding-top:14px;min-height:112px}
.press{flex:1;height:52px;border-radius:26px;background:var(--green);color:var(--card);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.press:hover{filter:brightness(1.06)}
.press i{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;opacity:.8}
.dt-done{flex:1;display:flex;flex-direction:column;gap:6px}
.dt-done b{font-size:15px}
.dt-done span{font-size:12px;color:var(--ink2)}
.dt-done button{align-self:flex-start;font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}

/* stamp */
.stamp{flex:none;width:96px;height:96px;border-radius:50%;border:2.5px solid var(--shu);color:var(--shu);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:10px;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5.5px var(--shu);position:relative;mix-blend-mode:multiply}
.stamp .s1{font-size:9px;font-weight:700;letter-spacing:.1em}
.stamp .s2{font-size:12px;font-weight:900;line-height:1.15;max-width:66px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stamp .s3{font-family:var(--mono);font-size:8.5px;border-top:1px solid currentColor;padding-top:2px;margin-top:1px}
.stamp.sm{width:84px;height:84px;padding:8px}
.stamp.sm .s2{font-size:11px;max-width:58px}
.stamp.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(1.9) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(var(--r,-8deg));opacity:1}}

/* book */
.book{position:absolute;inset:0;z-index:650;background:var(--paper);background-image:radial-gradient(oklch(0.86 0.016 85) 1px,transparent 1px);background-size:16px 16px;overflow-y:auto;padding:calc(var(--safe-top) + 4px) 0 100px;display:none}
.book.show{display:block}
[data-v="c"] .book{z-index:800;padding-bottom:40px}
.bk-hd{padding:6px 20px 0;display:flex;justify-content:space-between;align-items:center}
.bk-hd h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em}
.bk-sub{padding:2px 20px 0;font-size:12px;color:var(--ink2)}
.bk-prog{margin:16px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bk-prog .k{font-size:11px;color:var(--ink3)}
.bk-prog .v{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.1;margin-top:2px}
.bk-prog .v small{font-size:12px;color:var(--ink3)}
.bk-prog .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--paper2);overflow:hidden}
.bk-prog .bar i{display:block;height:100%;background:var(--shu);border-radius:3px}
.bk-sec{padding:22px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
.bk-sec b{font-size:14px;font-weight:900}
.bk-sec span{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.stamps{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 6px;scrollbar-width:none}
.stamps::-webkit-scrollbar{display:none}
.stamps button{flex:none;padding:4px}
.region{padding:12px 20px 4px;font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.1em}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;min-height:58px;transition:border-color .15s}
.pc:hover{border-color:var(--green)}
.pc b{font-size:13px;font-weight:700}
.pc span{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.pc .pb{height:3px;border-radius:2px;background:var(--paper2);margin-top:auto;overflow:hidden}
.pc .pb i{display:block;height:100%;background:var(--shu)}
.pc.got{border-color:color-mix(in oklch,var(--shu) 40%,var(--line))}
.pc.got::after{content:attr(data-n);position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--shu);color:var(--shu);font-size:9px;font-weight:900;display:grid;place-items:center;transform:rotate(-12deg);font-family:var(--mono)}
[data-v="b"] .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
[data-v="b"] .pc{min-height:76px;padding:10px}
[data-v="b"] .pc b{font-size:15px}
[data-v="b"] .pc.got::after{width:26px;height:26px;font-size:11px;right:8px;top:8px}

.toast{position:absolute;left:50%;top:calc(var(--safe-top) + 70px);transform:translate(-50%,-10px);z-index:1000;background:var(--ink);color:var(--paper);font-size:12px;padding:9px 14px;border-radius:18px;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.chip .lydots{display:flex;gap:2px}.chip .lydots:empty::before{content:"";width:12px;height:12px;border:1.5px solid var(--ink2);border-radius:3px;transform:rotate(45deg) scale(.8)}
.chip .lydots i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px var(--card)}
#lyBtn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}

  $('#sheet').style.display=st.tab==='map'?'':'none';
}

function bindSheet(){const sh=$('#sheet');if(!sh)return;const grips=[$('#handle'),sh.querySelector('.sh-head')];
  const ORDER=['min','peek','half','full'];
  const snapH=()=>{const cur=sh.style.height;sh.classList.add('drag');const o={};ORDER.forEach(k=>{sh.style.height='';sh.dataset.s=k;o[k]=sh.offsetHeight});sh.dataset.s=st.sheet;sh.style.height=cur;return o};
  let y0=0,h0=0,t0=0,moved=false,id=null;
  grips.forEach(g=>{if(!g)return;g.style.touchAction='none';g.style.cursor='grab';
    g.onpointerdown=e=>{id=e.pointerId;g.setPointerCapture(id);y0=e.clientY;h0=sh.offsetHeight;t0=performance.now();moved=false;sh.classList.add('drag')};
    g.onpointermove=e=>{if(id!==e.pointerId)return;const dy=e.clientY-y0;if(Math.abs(dy)>4)moved=true;if(moved){const mx=$('#app').offsetHeight-120;sh.style.height=Math.max(48,Math.min(mx,h0-dy))+'px'}};
    g.onpointerup=g.onpointercancel=e=>{if(id!==e.pointerId)return;id=null;
      if(!moved){sh.classList.remove('drag');sh.style.height='';setSheet(st.sheet==='min'?'half':{peek:'half',half:'full',full:'min'}[st.sheet]);return}
      const H=snapH(),h=sh.offsetHeight,v=(y0-e.clientY)/Math.max(1,performance.now()-t0);let best=st.sheet,bd=1e9;
      ORDER.forEach(k=>{const d=Math.abs(H[k]-h-v*180);if(d<bd){bd=d;best=k}});
      sh.offsetHeight;sh.classList.remove('drag');sh.style.height='';setSheet(best)}});
}
function setSheet(k){st.sheet=k;const sh=$('#sheet');if(sh)sh.dataset.s=k}
map.on('dragstart',()=>{if(V!=='c'&&st.tab==='map'&&(st.sheet==='half'||st.sheet==='full'))setSheet('min')});
function markCur(id){document.querySelectorAll('.ticket').forEach(t=>t.classList.toggle('cur',t.dataset.id===id))}
function onMarker(s){
  if(V==='c'){const i=st.list.slice(0,30).indexOf(s);if(i>=0){$('#cards').scrollTo({left:i*312,behavior:'smooth'});markCur(s.id)}select(s,{pan:false,open:true})}
  else select(s,{pan:false,open:!isPF(s)});
}
// ポケふたの点を選ぶと、点から絵柄の吹き出しを出す
const pfPop=L.popup({className:'pf-pop',closeButton:false,autoPan:true,offset:[0,-4],minWidth:150,maxWidth:180,autoPanPaddingTopLeft:[16,230],autoPanPaddingBottomRight:[16,380]});
function showPfPop(s){if(!isPF(s)){map.closePopup(pfPop);return}
  const src=s.img?`https://local.pokemon.jp/img/p/manhole/${s.img}_m.png`:'';
  pfPop.setLatLng([s.lat,s.lng]).setContent(`<div class="pfp"><a class="pfp-pic" href="${s.url}" target="_blank" rel="noopener" title="公式サイトで見る"><span class="pfp-ph">${src?'読み込み中…':'絵柄なし'}</span>${src?`<img src="${src}" alt="${s.name}のポケふたの絵柄" referrerpolicy="no-referrer" onload="this.parentNode.classList.add('ok')" onerror="this.parentNode.classList.add('err');this.previousElementSibling.textContent='公式サイトで絵柄を見る ↗'">`:''}</a><b>${s.name}${visited[s.id]?' <i class="pfp-got">済</i>':''}</b><small>${s.poke.join('・')}</small><button class="pfp-more" id="pfpMore">詳細・スタンプ ›</button></div>`).openOn(map);
  const b=document.getElementById('pfpMore');if(b)b.onclick=e=>{L.DomEvent.stop(e);pfKeep=true;map.closePopup(pfPop);pfKeep=false;renderDetail(true)}}
let pfKeep=false;
map.on('popupclose',e=>{if(e.popup===pfPop&&!pfKeep&&st.sel&&isPF(st.sel)&&!$('#detail').classList.contains('show')){st.sel=null;map.removeLayer(selRing)}});
function select(s,{pan,open}){
  st.sel=s;selRing.setLatLng([s.lat,s.lng]).addTo(map);if(isPF(s)&&!open){$('#detail').classList.remove('show');showPfPop(s)}else{pfKeep=true;map.closePopup(pfPop);pfKeep=false}
  if(pan){const z=Math.max(map.getZoom(),st.mode==='simple'?8:14);const pt=map.project([s.lat,s.lng],z).add([0,V==='c'?90:(open?140:100)]);map.setView(map.unproject(pt,z),z,{animate:true})}
  if(open)renderDetail(true);
}
function renderDetail(show,pop){
  const s=st.sel,d=$('#detail');if(!s){d.classList.remove('show');return}
  const v=visited[s.id];
  if(isPF(s))return renderPF(s,v,show,pop);
  d.innerHTML=`<div class="dt-top"><div><div class="dt-pf">${s.region} / ${s.pref} / ${s.city}</div><h3 class="dt-nm">${s.name}</h3>${(s.dt===true||s.no)?`<div class="dt-badges">${s.dt===true?`<span class="dthru yes" title="ドライブスルー対応" aria-label="ドライブスルー対応"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><rect x="3" y="11" width="18" height="6" rx="2" fill="currentColor"/><circle cx="7.5" cy="17.5" r="1.9" fill="currentColor"/><circle cx="16.5" cy="17.5" r="1.9" fill="currentColor"/></svg>対応</span>`:''}${s.no?`${s.url?`<a class="sno" href="${s.url}" target="_blank" rel="noopener" title="公式の店舗ページを開く">#${s.no}<span aria-hidden="true">↗</span></a>`:`<span class="sno">#${s.no}</span>`}`:''}</div>`:''}</div><button class="x" id="dx" aria-label="閉じる"></button></div>
  <dl class="dt-grid"><dt>状態</dt><dd>${badge(s)}</dd><dt>営業時間</dt><dd class="hrs">${s.hoursRaw?fmtHours(s.hoursRaw):(s.open?s.open+' – '+s.close:'情報なし')}</dd><dt>住所</dt><dd><a class="addr" href="${mapUrl(s)}" target="_blank" rel="noopener" title="地図アプリで開く"><span class="addr-t">${s.addr}</span><span class="addr-i" aria-label="地図アプリで開く"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5l5.5-2.5 7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg></span></a></dd></dl>
  <div id="route" class="rt"></div>
  <div class="dt-act">${v?`<div class="stamp ${pop?'pop':''}" style="--r:${rot(s.id)}deg;transform:rotate(${rot(s.id)}deg)"><span class="s1">${s.pref}</span><span class="s2">${s.name.replace(/店$/,'')}</span><span class="s3">${fmtDate(v)}</span></div><div class="dt-done"><b>${pop?'スタンプを押しました':'訪問済み'}</b><span>巡り帖 ${countKind('st')}店目 · ${s.pref}で${countPref(s.pref,'st')}店目</span><button id="undo">取り消す</button></div>`:`<button class="press" id="press"><i></i>スタンプを押す</button>`}</div>`;
  if(show)requestAnimationFrame(()=>d.classList.add('show'));
  $('#dx').onclick=closeDetail;
  const p=$('#press');if(p)p.onclick=()=>{visited[s.id]=new Date().toISOString();save();refreshStore(s);renderDetail(false,true)};
  const u=$('#undo');if(u)u.onclick=()=>{delete visited[s.id];save();refreshStore(s);renderDetail(false)};
}
const MAPI=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5l5.5-2.5 7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg>`;
function renderPF(s,v,show,pop){const d=$('#detail');
  d.innerHTML=`<div class="dt-top"><div><div class="dt-pf">POKEFUTA / ${s.region} / ${s.pref}</div><h3 class="dt-nm">${s.name}</h3><div class="dt-badges"><span class="pf-tag">ポケふた</span><a class="sno pf" href="${s.url}" target="_blank" rel="noopener" title="公式サイトの紹介ページを開く">No.${s.no}<span aria-hidden="true">↗</span></a></div></div><button class="x" id="dx" aria-label="閉じる"></button></div>
  ${s.img?`<figure class="pf-img" id="pfImg"><a class="pf-pic" href="${s.url}" target="_blank" rel="noopener" title="公式サイトで大きく見る"><span class="pf-ph">絵柄を読み込み中…</span><img src="https://local.pokemon.jp/img/p/manhole/${s.img}_m.png" alt="${s.name}のポケふたの絵柄（${s.poke.join('・')}）" decoding="async" referrerpolicy="no-referrer"></a><figcaption>絵柄：ポケモンローカルActs公式サイトより ©Pokémon. ©Nintendo/Creatures Inc./GAME FREAK inc.</figcaption><a class="pf-fb" href="${s.url}" target="_blank" rel="noopener">この画面では絵柄を表示できません。公式サイトで絵柄を見る ↗</a></figure>`:''}
  <dl class="dt-grid"><dt>ポケモン</dt><dd><div class="pkchips">${s.poke.length?s.poke.map(n=>`<span class="pkchip">${n}</span>`).join(''):'—'}</div></dd><dt>場所</dt><dd><a class="addr" href="${mapUrl(s)}" target="_blank" rel="noopener" title="地図アプリで開く"><span class="addr-t">${s.addr}</span><span class="addr-i" aria-label="地図アプリで開く">${MAPI}</span></a></dd>${s.note?`<dt>メモ</dt><dd class="dt-note">${s.note}</dd>`:''}</dl>
  <div id="route" class="rt"></div>
  <div class="dt-act">${v?`<div class="stamp pf ${pop?'pop':''}" style="--r:${rot(s.id)}deg;transform:rotate(${rot(s.id)}deg)"><span class="s1">${s.pref}</span><span class="s2">${s.city}</span><span class="s3">${fmtDate(v)}</span></div><div class="dt-done"><b>${pop?'スタンプを押しました':'見つけた！'}</b><span>ポケふた ${countKind('pf')}枚目 · ${s.pref}で${countPref(s.pref,'pf')}枚目</span><button id="undo">取り消す</button></div>`:`<button class="press pf" id="press"><i></i>見つけた！スタンプを押す</button>`}</div>`;
  const fg=$('#pfImg');if(fg){const im=fg.querySelector('img'),ok=()=>fg.classList.add('ok'),ng=()=>fg.classList.add('err');if(im.complete&&im.naturalWidth)ok();else if(im.complete)ng();else{im.onload=ok;im.onerror=ng;setTimeout(()=>{if(!im.naturalWidth)ng()},8000)}}
  if(show)requestAnimationFrame(()=>d.classList.add('show'));
  $('#dx').onclick=closeDetail;
  const p=$('#press');if(p)p.onclick=()=>{visited[s.id]=new Date().toISOString();save();refreshStore(s);renderDetail(false,true)};
  const u=$('#undo');if(u)u.onclick=()=>{delete visited[s.id];save();refreshStore(s);renderDetail(false)};
}
function closeDetail(){$('#detail').classList.remove('show');st.sel=null;map.removeLayer(selRing);map.closePopup(pfPop)}
const kindOf=id=>id[0]==='p'?'pf':'st';
const countPref=(p,k)=>Object.keys(visited).filter(id=>byId(id)&&byId(id).pref===p&&(!k||kindOf(id)===k)).length;
const countKind=k=>Object.keys(visited).filter(id=>byId(id)&&kindOf(id)===k).length;
function refreshStore(s){s.m.setStyle(mstyle(s));if(st.stamp!=='all'||st.hide.size)applyFilter(false);else renderHome();if(st.tab==='book')renderBook();
  if(V==='c'&&st.sel){markCur(st.sel.id);const i=st.list.slice(0,30).indexOf(st.sel);if(i>=0)$('#cards').scrollLeft=i*312}}

function renderBook(){
  const ids=Object.keys(visited).filter(id=>byId(id)).sort((a,b)=>visited[b].localeCompare(visited[a]));
  const prefs=new Set(ids.map(id=>byId(id).pref));
  const regions=[...new Set(PREFS.map(p=>p.r))];
  const nS=countKind('st'),nP=countKind('pf'),TP=PF.length;
  const stampOf=id=>{const s=byId(id),pf=isPF(s);return `<button data-id="${id}"><div class="stamp sm ${pf?'pf':''}" style="transform:rotate(${rot(id)}deg)"><span class="s1">${s.pref}</span><span class="s2">${pf?s.city:s.name.replace(/店$/,'')}</span><span class="s3">${fmtDate(visited[id])}</span></div></button>`};
  $('#book').innerHTML=`<div class="bk-hd"><h2>巡り帖</h2>${V==='c'?'<button class="x" id="bx" aria-label="閉じる"></button>':''}</div>
  <div class="bk-sub">訪れた店舗と見つけたポケふたにスタンプを押して、全国を巡ろう</div>
  <div class="bk-prog three"><div><div class="k">店舗</div><div class="v">${nS}<small> / ${TOTAL.toLocaleString()}</small></div><div class="mb"><i style="width:${Math.max(1.5,nS/Math.max(1,TOTAL)*100)}%"></i></div></div><div><div class="k">ポケふた</div><div class="v">${nP}<small> / ${TP}</small></div><div class="mb pf"><i style="width:${Math.max(1.5,nP/Math.max(1,TP)*100)}%"></i></div></div><div><div class="k">都道府県</div><div class="v">${prefs.size}<small> / 47</small></div><div class="mb pr"><i style="width:${Math.max(1.5,prefs.size/47*100)}%"></i></div></div></div>
  <div class="bk-sec"><b>最近のスタンプ</b><span>${ids.length}</span></div>
  <div class="stamps">${ids.length?ids.map(stampOf).join(''):'<div class="empty" style="padding:16px 4px">まだスタンプがありません</div>'}</div>
  <div class="bk-sec"><b>都道府県</b><span>タップで地図へ</span></div>
  ${regions.map(r=>`<div class="region">${r}</div><div class="pgrid">${PREFS.filter(p=>p.r===r).map(p=>{const a=countPref(p.n,'st'),b=countPref(p.n,'pf'),A=PC[p.n]||0,B=PCF[p.n]||0,n=a+b,sk=st.kind;
    const ratio=sk==='pf'?b/(B||1):sk==='st'?a/(A||1):(a+b)/((A+B)||1);
    return `<button class="pc ${n?'got':''}" data-n="${n}" data-p="${p.n}"><b>${p.n}</b>${sk!=='pf'?`<span class="ln ${A?'':'z'}">${a}/${A}</span>`:''}${sk!=='st'?`<span class="ln pf ${B?'':'z'}">${b}/${B}</span>`:''}<span class="pb ${sk==='pf'?'pf':''}"><i style="width:${ratio*100}%"></i></span></button>`}).join('')}</div>`).join('')}
  <p class="bk-note">● 緑：店舗　● 赤：ポケふた。ポケふたの設置場所・ポケモンは <a href="https://local.pokemon.jp/manhole/" target="_blank" rel="noopener">ポケモンローカルActs公式サイト</a> の掲載内容（${window.POKEFUTA_AT||''}取得、${TP}枚）をもとにしています。設置状況は変わることがあるため、お出かけ前に公式サイトをご確認ください。本アプリは非公式のファンメイドです。</p>`;
  $('#book').querySelectorAll('.pc').forEach(b=>b.onclick=()=>{st.pref=b.dataset.p;if(st.mode==='simple')setMode('car');$('#pref').value=st.pref;setTab('map');st.sheet='half';applyFilter(true)});
  $('#book').querySelectorAll('.stamps button').forEach(b=>b.onclick=()=>{const s=byId(b.dataset.id);if(st.kind!=='both'&&(st.kind==='pf')!==isPF(s))setKind('both');setTab('map');select(s,{pan:true,open:true})});
  const bx=$('#bx');if(bx)bx.onclick=()=>setTab('map');
}
function setTab(t){st.tab=t;$('#book').classList.toggle('show',t==='book');if(t==='book'){renderBook();closeDetail()}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const sh=$('#sheet');if(sh)sh.style.display=t==='map'?'':'none';
  if(t==='map')setTimeout(()=>map.invalidateSize(),0)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

// ---------- controls ----------
function fillPref(){const c=p=>st.kind==='st'?(PC[p]||0):st.kind==='pf'?(PCF[p]||0):(PC[p]||0)+(PCF[p]||0);$('#pref').innerHTML='<option value="">全国</option>'+PREFS.map(p=>`<option value="${p.n}">${p.n}（${c(p.n)}）</option>`).join('');$('#pref').value=st.pref}
function setKind(k,msg){st.kind=k;try{localStorage.setItem('meguri-kind',k)}catch(e){}
  const t=$('#kindSeg .seg3-t'),bs=[...document.querySelectorAll('#kindSeg button')],i=bs.findIndex(b=>b.dataset.k===k);t.dataset.i=i;t.className='seg3-t k-'+k;bs.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  if(st.sel&&k!=='both'&&(k==='pf')!==isPF(st.sel))closeDetail();fillPref();applyFilter(false);if(st.tab==='book')renderBook();
  if(msg)toast({both:'店舗とポケふたを表示',st:`店舗 ${st.list.length.toLocaleString()} 件を表示`,pf:`ポケふた ${st.list.length.toLocaleString()} 枚を表示`}[k])}
document.querySelectorAll('#kindSeg button').forEach(b=>b.onclick=()=>setKind(b.dataset.k,true));
fillPref();
$('#pref').onchange=e=>{st.pref=e.target.value;closeDetail();if(st.pref&&st.mode==='simple')setMode('car');applyFilter(true)};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#openSeg button').forEach((b,i)=>b.onclick=()=>{st.open=b.dataset.s;const t=$('#openSeg .seg3-t');t.dataset.i=i;t.className='seg3-t o-'+st.open;document.querySelectorAll('#openSeg button').forEach(x=>x.classList.toggle('on',x===b));applyFilter(false);toast({all:'すべて表示',open:`営業中の店舗とポケふた ${st.list.length.toLocaleString()} 件を表示`,closed:`営業時間外の店舗 ${st.list.length.toLocaleString()} 件を表示`}[st.open])});
document.querySelectorAll('#stampSeg button').forEach((b,i)=>b.onclick=()=>{st.stamp=b.dataset.s;const t=$('#stampSeg .seg3-t');t.dataset.i=i;t.className='seg3-t s-'+st.stamp;document.querySelectorAll('#stampSeg button').forEach(x=>x.classList.toggle('on',x===b));applyFilter(false);toast({all:'すべて表示',got:`スタンプ取得済 ${st.list.length.toLocaleString()} 件`,not:`未取得 ${st.list.length.toLocaleString()} 件`}[st.stamp])});
$('#loc').textContent='現在地: '+user.label;
$('#locate').onclick=()=>{
  const go=()=>{map.setView([user.lat,user.lng],Math.min(14,map.getMaxZoom()))};
  if(!navigator.geolocation){toast('位置情報が使えないため仮の現在地を使用中');go();return}
  navigator.geolocation.getCurrentPosition(p=>{user.lat=p.coords.latitude;user.lng=p.coords.longitude;user.label='取得済み';
    me.eachLayer(l=>l.setLatLng([user.lat,user.lng]));calcDist();$('#loc').textContent='現在地: 取得済み';if(st.pref){st.pref='';$('#pref').value=''}applyFilter(false);go();toast('現在地から近い順に並べ替えました')},
    ()=>{toast('位置情報を取得できないため、天王寺付近を現在地にしています');go()},{timeout:5000});
};
if(V==='c'){const b=document.createElement('button');b.className='bookbtn';b.innerHTML=`<i>${Object.keys(visited).length}</i>巡り帖`;b.onclick=()=>setTab('book');$('.brand').replaceChild(b,$('#loc'));
  const l=document.createElement('span');l.className='loc';l.id='loc';l.textContent='現在地: '+user.label;l.style.cssText='display:none'; document.body.appendChild(l)}
setMode(st.mode);
setKind(st.kind);
setTab(st.tab);
setInterval(()=>{st.list.forEach(s=>s.m.setStyle(mstyle(s)))},60000);
</script>
